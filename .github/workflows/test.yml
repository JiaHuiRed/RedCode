name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 261103 Red 两层 CI：push 只跑 smoke（核心 provider/session/httpapi，逐文件独立进程），
  # 全量 unit 与 httpapi gates 移到 nightly.yml。smoke 是唯一必过的回归围栏；全量套件
  # 当前有 100+ 个 4 核 Windows 环境超时，继续挡每次 push 只会制造红点疲劳。
  # cache 只由 typecheck workflow 保存（默认 save-cache=true）；这里、e2e、audit、nightly
  # 都跳过保存，避免并发 job 抢同一个 cache key 白等 6 分钟。
  smoke:
    name: smoke (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          save-cache: "false"

      - name: Run smoke tests
        working-directory: packages/opencode
        run: bun run test:smoke
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"

      - name: Publish smoke report
        if: always()
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6.4.0
        with:
          report_paths: packages/opencode/.artifacts/smoke/*.xml
          check_name: "smoke results (windows)"
          detailed_summary: true
          include_time_in_summary: true
          fail_on_failure: false

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-windows-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: packages/opencode/.artifacts/smoke/*.xml

  gitleaks:
    name: secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # 260728 Karina 原来钉的 7a6d2945 在上游仓库里根本不存在，CI 每次都是
        # "Unable to resolve action ... unable to find version"，3 秒失败 ——
        # 这个密钥扫描从 e5bc984（260720）加进来那天起就没真正跑过一次。
        # 重钉到 v2 标签当前指向的真实 commit。
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
