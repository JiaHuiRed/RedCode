name: nightly

# 261103 Red 全量实验室：4500+ unit 与 170 个 httpapi 场景当前在 4 核 Windows
# runner 上有 100+ 个环境超时，不再挡 push/PR；每天跑一轮，红点按周清。
# 发布前如果要拿全量做 release gate，再把它临时设为 required。
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit full (windows)
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          save-cache: "false"

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run full unit tests
        # 30s 超时是刻意保留的卡死信号；抬高到 60s 实测把 106 个超时拖成 2h7m，
        # 已经回退。这里的红是实验室数据，不是 push 门槛。
        # 261108 Red opencode 包 4629 测试原本单进程跑：118 个 fake-LLM 轮次测试
        # 确定性 FirstEventTimeout（首事件 75s 零到达），同 runner 同 bun 1.4.2 的
        # smoke lane（每文件独立进程）却全绿——同进程跨文件污染（261103 smoke
        # 注释已记录）。test:ci 加 --parallel=2：worker 进程互不共享 global
        # （蕴含 --isolate），2 匹配 4 核 runner 留余量给各文件自起的 server。
        run: bun turbo test:ci --concurrency=1 --continue=always
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"

      - name: Publish unit reports
        if: always()
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6.4.0
        with:
          report_paths: packages/*/.artifacts/unit/junit.xml
          check_name: "nightly unit results (windows)"
          detailed_summary: true
          include_time_in_summary: true
          fail_on_failure: false

      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-unit-windows-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: packages/*/.artifacts/unit/junit.xml

  gates:
    name: httpapi gates (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          save-cache: "false"

      - name: Run HttpApi exerciser gates
        working-directory: packages/opencode
        run: bun run test:httpapi
