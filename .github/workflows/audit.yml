name: audit

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          save-cache: "false"

      # 261114 Red 门禁改双步：全量报告保留可见性但不阻塞（moderate 下 153 条存量会
      # 永远红、淹没新回归），红色信号收敛到 critical。豁免清单：
      # - GHSA-26w7-cxv4-gfx2（astro AVIF RCE，修复在 6.1.6）：toolbeam-docs-theme@0.4.8
      #   peer 锁 astro ^5，跨 major 迁移前修不了；迁移落地时移除豁免。
      - name: Full advisory report (non-blocking)
        run: bun audit --audit-level=moderate || true

      - name: Block on critical advisories
        run: bun audit --audit-level=critical --ignore=GHSA-26w7-cxv4-gfx2
