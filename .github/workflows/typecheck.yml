name: typecheck

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  typecheck:
    # 260728 Karina 本 fork 只面向 Windows 10/11，CI 一律在 Windows 上跑，
    # 免得平台差异（路径、大小写、行尾）在本地和 CI 之间对不上账
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # 261103 Red 快闸：只有这个 job 保存 Bun cache；smoke/e2e/audit/nightly 都跳过，
      # 避免并发 job 抢同一个 cache key 白等 6 分钟。
      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck

      # 261103 Red 可复现契约从 test.yml 的 gates 前移：这些检查快、确定，和类型检查
      # 同属 push 必过层；httpapi 全量场景留在 nightly。
      - name: Run contract gates
        run: |
          bun run check:openapi-drift
          bun run check:subprocess-timeout
          bun run check:tool-description-budget
          bun run check:control-bytes
