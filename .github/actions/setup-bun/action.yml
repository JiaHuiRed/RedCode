name: "Setup Bun"
description: "Setup Bun with caching and install dependencies"
inputs:
  install-flags:
    description: "Additional flags to pass to 'bun install'"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Get baseline download URL
      id: bun-url
      shell: bash
      run: |
        if [ "$RUNNER_ARCH" = "X64" ]; then
          V=$(node -p "require('./package.json').packageManager.split('@')[1]")
          # 261006 Karina Windows 钉 1.4.2：patched peer 变体 EPERM（oven-sh/bun#28147）
          # 到 bun PR #33646（2026-07-08 合入）才修好，而 packageManager 钉的 1.3.14 早于它，
          # 只能靠 --linker hoisted 绕；hoisted 下 @hey-api/openapi-ts 会解析到顶层 catalog 的
          # typescript 7 原生移植版（无 ts.NewLineKind），sdk:build 必挂（实证：CI 37405656398）。
          # 其他 OS 维持 packageManager 版本。
          if [ "$RUNNER_OS" = "Windows" ]; then
            V=1.4.2
          fi
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ !steps.bun-url.outputs.url && 'package.json' || '' }}
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    - name: Get cache directory
      id: cache
      shell: bash
      run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

    - name: Restore Bun dependencies
      id: bun-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install setuptools for distutils compatibility
      run: python3 -m pip install setuptools || pip install setuptools || true
      shell: bash

    - name: Install dependencies
      # 261006 Karina 全 OS 统一默认 linker：#28147 已由 bun PR #33646 修复，Windows 的 bun
      # 已在上面钉到含修复的 1.4.2，不再需要 --linker hoisted；而保留 hoisted 会让
      # @hey-api/openapi-ts 吃到顶层 typescript 7 原生移植版把 sdk:build 挂掉。
      run: bun install ${{ inputs.install-flags }}
      shell: bash

    - name: Save Bun dependencies
      if: steps.bun-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
