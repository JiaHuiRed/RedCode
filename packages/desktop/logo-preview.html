<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>REDCODE Logo Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #ccc; font-family: 'Segoe UI', system-ui, sans-serif; padding: 40px; }
  h1 { font-size: 14px; color: #666; margin-bottom: 40px; font-weight: 400; letter-spacing: 2px; }
  .row { margin-bottom: 40px; }
  .label { font-size: 11px; color: #555; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .preview { padding: 24px 0; border-bottom: 1px solid #1a1a1a; }
  .dark-bg { background: #0a0a0a; }
  .light-bg { background: #f5f5f5; padding: 24px 0; }
  .size-note { font-size: 11px; color: #444; margin-top: 8px; }
  .compare { display: flex; gap: 48px; align-items: flex-end; }
  .compare .old { opacity: 0.25; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
</style>
</head>
<body>
<h1>REDCODE — LOGO PREVIEW · 红色调色</h1>

    </div>

</div>

</html>
