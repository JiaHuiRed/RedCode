<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RedCode TUI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e}
#term{width:100%;height:100%}
#status{position:fixed;top:8px;right:8px;padding:4px 10px;border-radius:4px;font:12px monospace;color:#fff;background:rgba(0,0,0,.6);z-index:10;pointer-events:none}
</style>
</head>
<body>
<div id="status">connecting...</div>
<div id="term"></div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
<script>
// 260703 Red TUI web terminal - xterm.js + PTY WebSocket
// __REDCODE_DIR__ is replaced server-side
;(async function(){
  const $ = (id) => document.getElementById(id)
  const status = $("status")
  const rcDir = "__REDCODE_DIR__"
  const hdrs = { "x-redcode-directory": rcDir, "Content-Type": "application/json" }

  // 1. Create PTY (shell)
  status.textContent = "creating terminal..."
  let pty
  try {
    const r = await fetch(location.origin + "/pty", { method: "POST", headers: hdrs, body: JSON.stringify({ title: "RedCode TUI (Web)", command: "__REDCODE_BIN__" }) })
    if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 100))
    pty = await r.json()
  } catch(e) {
    status.textContent = "PTY: " + e.message
    return
  }

  // 2. xterm.js
  const term = new window.Terminal({
    cursorBlink: true,
    fontSize: 14,
    fontFamily: "'Cascadia Code','Fira Code','JetBrains Mono',monospace",
    theme: { background: "#1a1a2e" },
    allowProposedApi: true,
  })
  const fitAddon = new window.FitAddon.FitAddon()
  term.loadAddon(fitAddon)
  term.loadAddon(new window.WebLinksAddon.WebLinksAddon())
  term.open($("term"))
  fitAddon.fit()

  // 3. WebSocket to PTY (no ticket needed - already behind Basic Auth)
  const wsProto = location.protocol === "https:" ? "wss:" : "ws:"
  const ws = new WebSocket(wsProto + "//" + location.host + "/pty/" + pty.id + "/connect")
  ws.binaryType = "arraybuffer"

  ws.onopen = () => {
    status.textContent = "connected"
    setTimeout(() => status.style.display = "none", 2000)
    const d = fitAddon.proposeDimensions()
    if (d) fetch(location.origin + "/pty/" + pty.id, { method: "PUT", headers: hdrs, body: JSON.stringify({ size: { cols: d.cols, rows: d.rows } }) }).catch(()=>{})
  }
  ws.onmessage = (ev) => {
    if (ev.data instanceof ArrayBuffer) {
      const b = new Uint8Array(ev.data)
      if (b[0] === 0) return
      term.write(b)
    } else {
      term.write(ev.data)
    }
  }
  ws.onclose = () => {
    status.style.display = "block"
    status.textContent = "disconnected"
    term.write("\r\n\x1b[31m--- disconnected ---\x1b[0m\r\n")
  }
  ws.onerror = () => {
    status.style.display = "block"
    status.textContent = "error"
  }

  term.onData((data) => { if (ws.readyState === 1) ws.send(data) })

  function doResize() {
    fitAddon.fit()
    const d = fitAddon.proposeDimensions()
    if (d && ws.readyState === 1)
      fetch(location.origin + "/pty/" + pty.id, { method: "PUT", headers: hdrs, body: JSON.stringify({ size: { cols: d.cols, rows: d.rows } }) }).catch(()=>{})
  }
  window.addEventListener("resize", doResize)
  window.addEventListener("orientationchange", () => setTimeout(doResize, 200))

  let lastTap = 0
  document.addEventListener("touchend", (e) => {
    if (Date.now() - lastTap < 300) e.preventDefault()
    lastTap = Date.now()
  }, { passive: false })

  term.focus()
})()
</script>
</body>
</html>
