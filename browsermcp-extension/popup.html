<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; padding: 16px; font-family: -apple-system, sans-serif; }
    h3 { margin: 0 0 12px; font-size: 14px; }
    .status { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }
    .connected { background: #d4edda; color: #155724; }
    .disconnected { background: #f8d7da; color: #721c24; }
    button { width: 100%; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .connect { background: #007bff; color: white; }
    .disconnect { background: #dc3545; color: white; }
  </style>
</head>
<body>
  <h3>Browser MCP</h3>
  <div id="status" class="status disconnected">Disconnected</div>
  <button id="btn" class="connect">Connect</button>
  <script src="popup.js"></script>
</body>
</html>
